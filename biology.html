<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中生物学知识图谱 | 人教版全套</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo bio">◈</span>
    <div>
      <h1>高中生物学知识图谱</h1>
      <p id="subtitle">依据人教版全套电子教材目录生成</p>
    </div>
  </div>
  <div class="searchbox">
    <input id="search" type="text" placeholder="搜索章节 / 知识点…（回车定位下一个）" autocomplete="off">
    <span id="searchCount"></span>
  </div>
  <nav id="subjectTabs" class="subnav">
    <a href="index.html">总览</a>
    <a href="physics.html">物理</a>
    <a href="biology.html" class="current">生物学</a>
    <a href="geo.html">地理</a>
    <a href="chem.html">化学</a>
  </nav>
</header>

<div id="layout">
  <aside id="sidebar">
    <section class="panel">
      <h2>图例</h2>
      <div id="legend"></div>
    </section>
    <section class="panel">
      <h2>教材目录</h2>
      <div id="stats" class="muted"></div>
      <div id="bookList"></div>
    </section>
    <section class="panel controls">
      <button id="btnFit">⤢ 适配视图</button>
      <button id="btnShuffle">⟳ 重新布局</button>
      <button id="btnPause">⏸ 暂停运动</button>
      <button id="btnKP">◆ 知识点：开</button>
    </section>
    <footer class="panel muted">
      目录提取自人教版电子教材；连线为教材章节层级，<span class="crossline">虚线弧</span>为跨章知识关联。拖动节点、滚轮缩放、点击查看详情。
    </footer>
  </aside>

  <main id="stage">
    <canvas id="graph"></canvas>
    <div id="hoverTip" class="hidden"></div>
    <aside id="detail" class="hidden">
      <button id="detailClose">✕</button>
      <div id="detailBody"></div>
    </aside>
  </main>
</div>

<script>window.PAGE_SUBJECT = "biology";</script>
<script src="data.js"></script>
<script src="knowledge.js"></script>
<script src="app.js"></script>
</body>
</html>
