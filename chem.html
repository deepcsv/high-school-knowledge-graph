<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中化学知识图谱 | 无机 · 有机（反应类型连接）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo chem">◈</span>
    <div>
      <h1>高中化学知识图谱</h1>
      <p id="subtitle">无机 · 有机两大分支，以反应类型连接（参考人教版必修+选择性必修）</p>
    </div>
  </div>
  <div class="searchbox">
    <input id="search" type="text" placeholder="搜索物质 / 概念…（回车定位下一个）" autocomplete="off">
    <span id="searchCount"></span>
  </div>
  <nav id="subjectTabs" class="subnav">
    <a href="index.html">总览</a>
    <a href="physics.html">物理</a>
    <a href="biology.html">生物学</a>
    <a href="chem.html" class="current">化学</a>
    <a href="geo.html">地理</a>
  </nav>
</header>

<div id="layout">
  <aside id="sidebar">
    <section class="panel">
      <h2>图例</h2>
      <div id="legend"></div>
    </section>
    <section class="panel">
      <h2>专题目录</h2>
      <div id="stats" class="muted"></div>
      <div id="bookList"></div>
    </section>
    <section class="panel controls">
      <button id="btnFit">⤢ 适配视图</button>
      <button id="btnShuffle">⟳ 重新布局</button>
      <button id="btnPause">⏸ 暂停运动</button>
    </section>
    <footer class="panel muted">
      内容参考人教版高中化学教材；<span class="crossline">彩色弧线</span>为化学反应连线（颜色=反应类型），悬停或点击节点可在连线上看到化学方程式。拖动节点、滚轮缩放、点击查看详情。
    </footer>
  </aside>

  <main id="stage">
    <canvas id="graph"></canvas>
    <div id="hoverTip" class="hidden"></div>
    <aside id="detail" class="hidden">
      <button id="detailClose">✕</button>
      <div id="detailBody"></div>
    </aside>
  </main>
</div>

<script>window.PAGE_SUBJECT = "chemistry";</script>
<script src="chem.js"></script>
<script src="app.js"></script>
</body>
</html>
